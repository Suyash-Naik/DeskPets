# Pytest configuration.
#
# Deliberately a pytest.ini and not a pyproject.toml: CLAUDE.md rules pyproject.toml out for
# this repo (pixi owns the environment), and a standalone ini keeps the test runner's config
# from looking like a second, competing packaging story.

[pytest]
testpaths = tests

# `src` is imported as a package (`from src import config`), so the repo root -- not tests/ --
# has to be on sys.path. Without this, tests/ would be the rootdir insertion and every import
# would fail. pytest >= 7 supports this natively; no conftest sys.path hacking needed.
pythonpath = .

# -p no:cacheprovider: no .pytest_cache/ in the working tree. The pixi `test` task also sets
# PYTHONDONTWRITEBYTECODE=1, which covers __pycache__/.
addopts = -p no:cacheprovider --strict-markers -ra

markers =
    slow: measures real wall-clock time and spins a live Qt event loop. Excluded by `-m "not slow"`, which is the fast default run. Every tolerance in these is derived from a number measured in PHASE1-LOG.md, with an order of magnitude of headroom.
    windows: needs a real Win32 HWND, ctypes against user32, or the Windows notification area. Skipped with a reason elsewhere -- never failed.
