project:
  type: website
  output-dir: _site
  # Only .qmd pages are rendered, so the internal .md notes (BuildPlan, PHASE1-*, codex guide)
  # stay out of the public site. Move one to .qmd to publish it.
  render:
    - "**/*.qmd"

website:
  title: "DeskPets"
  description: "DeskPets is a reactive desktop pet app that interacts with the user based on their computer usage. It is designed to be the perfect ADHD friendly working companion."
  site-url: https://suyashnaik.com/DeskPets
  repo-url: https://github.com/Suyash-Naik/DeskPets
  repo-actions: [issue]
  favicon: assets/img/favicon.ico

  open-graph: true
  twitter-card: true

  navbar:
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      # Each entry below opens the sidebar with the matching id (see `sidebar:` further down).
      - sidebar:guide
      - sidebar:internals
      - sidebar:project
    right:
      - text: "Case Study"
        href: https://suyashnaik.com/projects/desk-pets.html
      - icon: github
        href: https://github.com/Suyash-Naik/DeskPets
        aria-label: GitHub

  # One sidebar per navbar group. A page appears in a sidebar only once it is listed here, so
  # add each new page as it is written. Planned pages, by group:
  #   guide:     stats-card, tray-and-controls, pomodoro, configuration, known-limitations
  #   project:   roadmap, download
  sidebar:
    - id: guide
      title: "Guide"
      style: docked
      contents:
        - guide/getting-started.qmd
        - guide/pets-and-states.qmd
    - id: internals
      title: "Under the hood"
      style: docked
      contents:
        - internals/how-it-works.qmd
        - internals/built-with-agents.qmd
        - internals/art-pipeline.qmd
        - internals/generating-sprites.qmd
        - internals/contributing.qmd
    - id: project
      title: "Project"
      style: docked
      contents:
        - project/about.qmd

  page-footer:
    center: "© 2026 Suyash Naik · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [lux, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    anchor-sections: true
    smooth-scroll: true
    grid:
      body-width: 860px
      margin-width: 180px
    lightbox: auto
